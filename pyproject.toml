[project]
name = "pccontext"
version = "0.8.0"
description = "Chain Contexts for PyCardano library"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Hareem Adderley", email = "hadderley@kingpinapps.com" },
]
keywords = ["python", "cardano", "blockchain", "crypto"]
requires-python = ">=3.10,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "koios-python>=2.0.0,<3.0.0",
    "requests>=2.32.4,<3.0.0",
    "cachetools>=5.5.2,<6.0.0",
    "ogmios>=1.4.2,<2.0.0",
    "pycardano>=0.19.0,<0.20.0",
    # Pinned below 6.0.0: pycardano's cbor2pure shim is incompatible with cbor2 6.x.
    # Floor of 5.9.0 addresses GHSA-3c37-wwvx-h642.
    "cbor2>=5.9.0,<6.0.0",
    # Imported directly by the Blockfrost backend rather than only via
    # pycardano. 0.7.0 is the floor: it adds the governance and network_eras
    # endpoints that backend uses.
    "blockfrost-python>=0.7.0,<1.0.0",
    "yaci-client>=1.0,<2.0",
]

[project.urls]
homepage = "https://github.com/KINGH242/pccontext"
repository = "https://github.com/KINGH242/pccontext.git"
documentation = "https://pccontext.readthedocs.io/en/latest/"


# Temporary: points koios-python at the fork branch that adds the Governance
# endpoints, so they can be exercised here before the upstream PR is opened.
# Must be removed before any release — a git dependency cannot be published.
[tool.poetry.dependencies]
koios-python = { git = "https://github.com/KINGH242/koios-python.git", branch = "feat/governance-api" }
blockfrost-python = { git = "https://github.com/KINGH242/blockfrost-python.git", branch = "feat/governance-committee" }


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
black = "^26.3.1"
flake8 = "^7.1.1"
mypy = "^1.14.1"
ruff = "^0.6.3"
faker = "^28.4.1"
pytest-cov = "^5.0.0"
isort = "^5.13.2"
flake8-pyproject = "^1.2.3"
freezegun = "^1.5.1"


[tool.poetry.group.docs.dependencies]
sphinx = ">=8.1,<9.0"
sphinx-rtd-theme = ">=3.0,<4.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-p no:cacheprovider"


[tool.commitizen]
name = "cz_conventional_commits"
version = "0.8.0"
version_files = [
    "pccontext/__init__.py:__version__",
    "pyproject.toml:version"
]
update_changelog_on_bump = true
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.flake8]
ignore = ['E231', 'E241', 'D203', 'E126', 'W503', 'E203']
exclude = ['.git', '__pycache__', 'build', 'E126', 'W503', 'E203']
per-file-ignores = [
    '__init__.py:F401',
]
max-line-length = 120
count = true


[tool.ruff]
lint.ignore = [
    "E501",
    "F841",
]


[tool.isort]
profile = "black"
skip = ["pccontext/models/__init__.py"]


[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["str-bytes-safe"]
python_version = "3.10"

