# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_create_environment:
      - pip install "poetry==2.1.3"
    post_install:
      # VIRTUAL_ENV must point at the environment Read the Docs actually builds
      # in, so Poetry installs into it. Without this, Poetry installs elsewhere
      # and Sphinx fails to import the project's dependencies.
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH poetry install --with docs

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

formats:
  - pdf
  - epub
